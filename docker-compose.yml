services:
  db:
    image: postgres:17
    container_name: bmn-blog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bmn
      POSTGRES_PASSWORD: POSTGRES_PASSWORD
      POSTGRES_DB: blog
    ports:
      - "127.0.0.1:5432:5432"   # só acessível pelo seu computador
    volumes:
      - dados_db:/var/lib/postgresql/data
      # Na primeira subida (volume vazio), o Postgres roda estes arquivos em ordem alfabética.
      # Em banco que já tem dados, nada acontece: rode as migrações novas à mão.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro


volumes:
  dados_db:
