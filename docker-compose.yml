services:
  db:
    image: postgres:17
    container_name: bmn-blog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bmn
      POSTGRES_PASSWORD: POSTGRES_PASSWORD
      POSTGRES_DB: blog
    ports:
      - "127.0.0.1:5432:5432"   # só acessível pelo seu computador
    volumes:
      - dados_db:/var/lib/postgresql/data
      # As tabelas são criadas pelo "npm run migration", não pelo Docker.

volumes:
  dados_db:
